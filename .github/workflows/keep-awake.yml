name: Keep Supabase awake

# Supabase's free plan pauses projects after ~7 days of inactivity
# (first real outage: 2026-10-14, both shops showed "Failed to fetch").
# This job visits the shop API every 3 days so the project can never
# idle long enough to sleep. The apikey below is the PUBLIC publishable
# key — it ships inside every customer's browser already.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit Hiwote's shop API
        run: |
          code=$(curl -s -o /tmp/body.txt -w "%{http_code}" -X POST "https://xmvhctukvnbrwdwevfco.supabase.co/rest/v1/rpc/public_storefront_items" -H "apikey: sb_publishable_33p448jGnQfTZab7rB9nHw_y6NUkqjy" -H "Content-Type: application/json" -d '{"p_slug":"hiwote-jv7v"}')
          echo "HTTP $code"
          head -c 300 /tmp/body.txt; echo
          if [ "$code" != "200" ]; then
            echo "::warning::Keep-alive got HTTP $code -- check the Supabase project"
            exit 1
          fi
